name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: nubjs/setup-nub@21b317c170eee658503996209cf87b63481be35a
        with:
          node-version: 24
          nub-version: 0.7.5
          cache: false
      - run: nub install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51
        id: mode
      - run: nub run build
        if: steps.mode.outputs.mode == 'publish'
      - uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51
        id: pack
        if: steps.mode.outputs.mode == 'publish'
        env:
          npm_config_ignore_scripts: true
        with:
          publish-plan-artifact-id: ${{ steps.mode.outputs.publish-plan-artifact-id }}

  version:
    needs: prepare
    if: needs.prepare.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: nubjs/setup-nub@21b317c170eee658503996209cf87b63481be35a
        with:
          node-version: 24
          nub-version: 0.7.5
          cache: false
      - run: nub install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51
        env:
          npm_config_ignore_scripts: true
        with:
          script: nub run version-packages
          pr-base-branch: main
          commit-message: 'chore: release package'
          pr-title: 'chore: release package'

  publish:
    needs: prepare
    if: needs.prepare.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: nubjs/setup-nub@21b317c170eee658503996209cf87b63481be35a
        with:
          node-version: 24
          nub-version: 0.7.5
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - run: nub install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51
        env:
          npm_config_ignore_scripts: true
        with:
          pack-dir-artifact-id: ${{ needs.prepare.outputs.pack-dir-artifact-id }}
